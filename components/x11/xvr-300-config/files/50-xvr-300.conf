# Sun XVR-300 (Radeon RV370) in slot PCI-E 2 of an Ultra 45.
#
# Tested with a digital monitor (Dell S3221QS) at 1920x1200 and 1680x1050.
# 1920x1200 at 60 Hz (154 MHz) is the highest mode tested on its DVI port.
# The sync ranges come from the monitor's EDID.  BusID: see scanpci for
# another slot.
#
# Acceleration: EXA over MMIO (no DRM driver on illumos yet).  Render
# acceleration is off: anti-aliased text was 1.5 to 2 times slower with it.
# ConnectorTable: the card has FCode instead of a PC BIOS, so the driver
# cannot tell that the DVI port is digital.

# The default module path is only modules/sparcv9, where input/ is missing.
Section "Files"
    ModulePath "/usr/lib/xorg/modules/sparcv9,/usr/lib/xorg/modules"
EndSection

Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "AutoAddDevices" "false"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Module"
    Disable "dri"
    Disable "dri2"
EndSection

Section "Monitor"
    Identifier "Monitor0"
    ModeLine "1680x1050" 119.00 1680 1728 1760 1840 1050 1053 1059 1080 +hsync -vsync
    ModeLine "1920x1080" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
    ModeLine "1920x1200" 154.00 1920 1968 2000 2080 1200 1203 1209 1235 +hsync -vsync
    Option "PreferredMode" "1920x1200"
    Option "Enable" "true"
EndSection

Section "Device"
    Identifier "XVR300"
    Driver "radeon"
    BusID "PCI:2@1:0:0"
    Option "NoAccel" "false"
    Option "AccelMethod" "EXA"
    Option "RenderAccel" "false"
    Option "SWcursor" "true"
    Option "monitor-DVI-0" "Monitor0"
    Option "monitor-DVI-1" "Monitor0"
    Option "ConnectorTable" "100,0,1,3,96,0,2,3"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "XVR300"
    Monitor "Monitor0"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1920 1200
        Modes "1920x1200" "1920x1080" "1680x1050"
    EndSubSection
EndSection

Section "InputDevice"
    Identifier "Mouse0"
    Driver "mouse"
    Option "Protocol" "auto"
    Option "Device" "/dev/mouse"
EndSection

Section "ServerLayout"
    Identifier "Layout0"
    Screen "Screen0"
    InputDevice "Keyboard0" "CoreKeyboard"
    InputDevice "Mouse0" "CorePointer"
EndSection
